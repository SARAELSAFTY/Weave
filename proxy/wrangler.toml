name = "weave-groq-proxy"
main = "src/index.js"
compatibility_date = "2024-04-01"

# The GROQ_API_KEY secret is not committed here.
# Set it securely using:
#   npx wrangler secret put GROQ_API_KEY

[[ratelimits]]
name = "RELAY_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 30
  period = 60

